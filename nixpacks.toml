[build]
builder = "NIXPACKS_PYTHON"

[phases.setup]
nixPkgs = [
  "gcc", 
  "libffi", 
  "zlib",
  "libjpeg",
  "libpng",
  "libtiff",
  "pkgconfig",
  "python312",
  "python312Packages.pip",
  "python312Packages.wheel",
  "python312Packages.setuptools"
]

[phases.install]
cmds = [
  "pip install wheel",
  "pip install -r requirements.txt"
]

[start]
cmd = "cd src && gunicorn core.wsgi:application --log-file -"