[build]
provider = "nixpacks"

[variables]
NODE_VERSION = "18"

[phases.setup]
aptPkgs = [
  "gcc",
  "g++",
  "make",
  "pkg-config",
  "python3-dev",
  "libffi-dev",
  "libjpeg-dev",
  "zlib1g-dev",
  "libpng-dev",
  "libtiff-dev"
]
cmds = [
  "mkdir -p /usr/include/ffi",
  "find /nix/store -name 'ffi.h' -exec cp {} /usr/include/ffi/ \\\;",
  "find /nix/store -name 'ffitarget.h' -exec cp {} /usr/include/ffi/ \\\;"
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip setuptools wheel",
  "export CFLAGS='-I/usr/include/ffi'",
  "export LDFLAGS='-L/usr/lib/x86_64-linux-gnu/'",
  ". /opt/venv/bin/activate && pip install cffi==1.15.0 --only-binary=cffi",
  ". /opt/venv/bin/activate && pip install -r requirements.txt --no-build-isolation"
]

[start]
cmd = ". /opt/venv/bin/activate && cd src && gunicorn core.wsgi:application --log-file -"