[build]
provider = "nixpacks"

[variables]
NODE_VERSION = "18"

[phases.setup]
aptPkgs = [
  "gcc",
  "g++",
  "make",
  "pkg-config",
  "python3-dev",
  "libffi-dev",
  "libjpeg-dev",
  "zlib1g-dev",
  "libpng-dev",
  "libtiff-dev",
  "tesseract-ocr",
  "tesseract-ocr-eng",
  "poppler-utils",
  "libtesseract-dev",
  "libleptonica-dev"
]
cmds = [
  "echo 'Checking Tesseract installation:' && tesseract --version"
]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip setuptools wheel",
  ". /opt/venv/bin/activate && pip install -r requirements.txt --no-build-isolation"
]

[start]
cmd = ". /opt/venv/bin/activate && cd src && DJANGO_SETTINGS_MODULE=core.settings.production gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --log-file -"