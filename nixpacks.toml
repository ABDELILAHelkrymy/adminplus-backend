[phases.setup]
aptPkgs = [
  "python3-dev", 
  "build-essential",
  "libffi-dev",
  "libjpeg-dev", 
  "libpng-dev", 
  "zlib1g-dev", 
  "libtiff-dev",
  "python3-cffi",
  "pkg-config",
  "gcc",
  "python3-pip"
]

[phases.install]
cmds = [
  "python3 -m ensurepip",
  "python3 -m pip install --upgrade pip setuptools wheel",
  "python3 -m pip install cffi --no-binary cffi",
  "python3 -m pip install -r requirements.txt"
]